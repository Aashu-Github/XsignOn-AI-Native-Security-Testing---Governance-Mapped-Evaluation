name: internal-kb-assistant
type: rag                # <- this is what flips RAGAS on for this target

endpoint: http://layer1-gateway.internal:8080/v1/rag/query
model: internal-kb-assistant-v1

request_template:
  query: "{input}"

# For RAG targets, the response must expose both the answer and the
# retrieved chunks, since RAGAS needs retrieved_contexts to score
# faithfulness. Adjust these paths to match your actual gateway response.
response_path: answer
context_path: retrieved_chunks   # expected to be a list[str] in the response body
