# Describes a real system under test. layer4/gateway_client.py reads this
# to know where to send probes and how to parse the response.
#
# `type` is the field that answers the research doc's open question:
# "How does Layer 4 know a target is a RAG stack?" — it's explicit config,
# not inference. Whoever onboards a new target to Layer 1 sets it here.

name: support-chatbot-v2.3
type: chat              # chat | rag  -> controls whether RAGAS runs at all

# Layer 1 gateway endpoint that fronts the actual model. All judge and
# target calls should be auditable, so route through the gateway rather
# than hitting the model provider directly.
endpoint: http://layer1-gateway.internal:8080/v1/chat/completions
model: support-chatbot-v2.3

# How to build the request body sent to `endpoint`. {input} is replaced
# with each probe's input text.
request_template:
  messages:
    - role: user
      content: "{input}"

# JSON path (dot notation) to pull the model's reply out of the response body.
response_path: choices.0.message.content
