<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layer 4 — Eval Gate</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f27;
    --panel-2: #20242e;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --pass: #3fb950;
    --fail: #f85149;
    --skip: #8b93a1;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 2.5rem 1.5rem 5rem;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { margin-bottom: 2rem; }
  header .eyebrow {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }
  h1 { font-size: 1.6rem; margin: 0.3rem 0 0.4rem; font-weight: 650; }
  header p { color: var(--muted); margin: 0; font-size: 0.92rem; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.4rem; }
  select, input[type="number"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.7rem;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 0.9rem;
  }
  .row { margin-bottom: 1.1rem; }
  .row:last-child { margin-bottom: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 1.4rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(79,140,255,0.06); }
  .dropzone strong { color: var(--text); }
  .dropzone input { display: none; }
  .filename { margin-top: 0.5rem; font-family: var(--mono); font-size: 0.8rem; color: var(--accent); }

  .threshold-row { display: flex; align-items: center; gap: 0.9rem; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .threshold-val {
    font-family: var(--mono); font-size: 1rem; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.35rem 0.6rem; min-width: 3.6rem; text-align: center;
  }
  .gate-line {
    position: relative; height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--fail), var(--pass));
    margin-top: 0.6rem;
  }
  .gate-marker {
    position: absolute; top: -4px; width: 2px; height: 14px;
    background: var(--text); transform: translateX(-1px);
  }

  button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.75rem 1rem;
    border-radius: 7px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  button:disabled { opacity: 0.5; cursor: default; }

  #status { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); margin-top: 0.8rem; min-height: 1.2em; }
  #status.error { color: var(--fail); font-weight: 600; }

  #results { display: none; }
  .verdict-banner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.3rem; border-radius: 8px; margin-bottom: 1rem;
    font-family: var(--mono);
  }
  .verdict-banner.pass { background: rgba(63,185,80,0.12); border: 1px solid rgba(63,185,80,0.4); }
  .verdict-banner.fail { background: rgba(248,81,73,0.12); border: 1px solid rgba(248,81,73,0.4); }
  .verdict-banner .big { font-size: 1.3rem; font-weight: 700; }
  .verdict-banner.pass .big { color: var(--pass); }
  .verdict-banner.fail .big { color: var(--fail); }

  .metric-row {
    display: grid;
    grid-template-columns: 110px 1fr 90px 60px;
    align-items: center;
    gap: 0.8rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.83rem;
  }
  .metric-row:last-child { border-bottom: none; }
  .metric-tool { color: var(--muted); font-family: var(--mono); font-size: 0.72rem; }
  .metric-name { font-family: var(--mono); }
  .metric-bar-track {
    position: relative; height: 5px; background: var(--panel-2); border-radius: 3px; margin-top: 0.3rem;
  }
  .metric-bar-fill { position: absolute; height: 100%; border-radius: 3px; }
  .metric-bar-threshold { position: absolute; top: -3px; width: 2px; height: 11px; background: var(--text); opacity: 0.6; }
  .metric-score { font-family: var(--mono); text-align: right; }
  .metric-verdict { text-align: right; font-weight: 700; font-family: var(--mono); font-size: 0.72rem; }

  .notes { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); }
  .notes li { margin-bottom: 0.25rem; }
  .report-links { margin-top: 1rem; display: flex; gap: 0.8rem; }
  .report-links a {
    font-size: 0.82rem; color: var(--accent); text-decoration: none;
    border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 6px;
  }
  .report-links a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Layer 4 // Evaluation Gate</div>
    <h1>Does it still behave well?</h1>
    <p>Upload your own test prompts, pick the passing score, and run it against a real local model — no terminal after this.</p>
  </header>

  <div class="panel">
    <div class="row">
      <label for="target">Target</label>
      <select id="target">
        {% for t in targets %}
        <option value="{{ t.target_id }}">{{ t.target_id }} ({{ t.target_type }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="row">
      <label>Your test data <span style="color:var(--muted)">(.json or .csv — optional, uses built-in samples if skipped)</span></label>
      <div class="dropzone" id="dropzone">
        <div id="dropzoneText"><strong>Click to choose a file</strong> or drag one here</div>
        <div class="filename" id="filename"></div>
        <input type="file" id="fileInput" accept=".json,.csv">
      </div>
    </div>

    <div class="row">
      <label for="threshold">Passing score <span style="color:var(--muted)">(minimum to count as a pass, applied across every metric)</span></label>
      <div class="threshold-row">
        <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.85">
        <div class="threshold-val" id="thresholdVal">0.85</div>
      </div>
      <div class="gate-line"><div class="gate-marker" id="gateMarker" style="left:85%"></div></div>
    </div>

    <div class="grid2 row">
      <div>
        <label for="promptsPerSeed">Prompts per seed row</label>
        <input type="number" id="promptsPerSeed" value="1" min="1" max="10">
      </div>
      <div>
        <label for="modelName">Ollama model</label>
        <input type="text" id="modelName" value="llama3.2:3b">
      </div>
    </div>

    <div class="row" style="margin-top:1.3rem">
      <button id="runBtn">Run test</button>
      <div id="status"></div>
    </div>
  </div>

  <div class="panel" id="results">
    <div id="verdictBanner"></div>
    <div id="metricList"></div>
    <ul class="notes" id="notesList"></ul>
    <div class="report-links" id="reportLinks"></div>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const thresholdSlider = document.getElementById('threshold');
const thresholdVal = document.getElementById('thresholdVal');
const gateMarker = document.getElementById('gateMarker');
const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

let chosenFile = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) {
    chosenFile = e.dataTransfer.files[0];
    filenameEl.textContent = chosenFile.name;
  }
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) {
    chosenFile = fileInput.files[0];
    filenameEl.textContent = chosenFile.name;
  }
});

function updateThresholdUI() {
  const v = parseFloat(thresholdSlider.value);
  thresholdVal.textContent = v.toFixed(2);
  gateMarker.style.left = (v * 100) + '%';
}
thresholdSlider.addEventListener('input', updateThresholdUI);
updateThresholdUI();

runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  resultsEl.style.display = 'none';
  statusEl.classList.remove('error');
  statusEl.textContent = 'Running — this can take a minute if the model is generating and judging live...';

  const form = new FormData();
  form.append('target_id', document.getElementById('target').value);
  form.append('threshold', thresholdSlider.value);
  form.append('prompts_per_seed', document.getElementById('promptsPerSeed').value);
  form.append('model', document.getElementById('modelName').value);
  if (chosenFile) form.append('file', chosenFile);

  try {
    const res = await fetch('/api/run', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) {
      statusEl.classList.add('error');
      statusEl.textContent = data.error || 'unknown error';
      runBtn.disabled = false;
      return;
    }
    renderResults(data);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.classList.add('error');
    statusEl.textContent = 'Could not reach the server — is app.py still running?';
  }
  runBtn.disabled = false;
});

function renderResults(data) {
  resultsEl.style.display = 'block';

  const banner = document.getElementById('verdictBanner');
  const isPass = data.overall_verdict === 'pass';
  banner.className = 'verdict-banner ' + (isPass ? 'pass' : 'fail');
  banner.innerHTML = `
    <div>target: <strong>${data.target_id}</strong> (${data.target_type})</div>
    <div class="big">${data.overall_verdict.toUpperCase()}</div>
  `;

  const list = document.getElementById('metricList');
  list.innerHTML = '';
  data.metrics.forEach(m => {
    const score = m.score;
    const threshold = m.threshold;
    const color = m.verdict === 'pass' ? 'var(--pass)' : (m.verdict === 'fail' ? 'var(--fail)' : 'var(--skip)');
    const scorePct = score !== null ? Math.max(0, Math.min(100, score * 100)) : 0;
    const threshPct = threshold !== null ? Math.max(0, Math.min(100, threshold * 100)) : null;
    const live = m.notes && m.notes.includes('live judge') ? ' 🟢' : '';

    const row = document.createElement('div');
    row.className = 'metric-row';
    row.innerHTML = `
      <div class="metric-tool">${m.tool}</div>
      <div>
        <div class="metric-name">${m.metric}${live}</div>
        <div class="metric-bar-track">
          <div class="metric-bar-fill" style="width:${scorePct}%; background:${color}"></div>
          ${threshPct !== null ? `<div class="metric-bar-threshold" style="left:${threshPct}%"></div>` : ''}
        </div>
      </div>
      <div class="metric-score">${score !== null ? score.toFixed(3) : '--'}</div>
      <div class="metric-verdict" style="color:${color}">${m.verdict}</div>
    `;
    list.appendChild(row);
  });

  const notesList = document.getElementById('notesList');
  notesList.innerHTML = '';
  (data.notes || []).forEach(n => {
    const li = document.createElement('li');
    li.textContent = n;
    notesList.appendChild(li);
  });

  const links = document.getElementById('reportLinks');
  links.innerHTML = `
    <a href="${data.report_html_url}" target="_blank">Open full HTML report</a>
    <a href="${data.report_json_url}" target="_blank">View raw JSON</a>
  `;
}
</script>
</body>
</html>
